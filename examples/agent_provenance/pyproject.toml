[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cael-provenance-bridge"
version = "0.1.0"
description = "Optional source-linked CAEL reasoning tools for workflow runtimes"
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.urls]
Source = "https://github.com/Vovala14/CAEL/tree/codex/agent-provenance/examples/agent_provenance"
Documentation = "https://github.com/Vovala14/CAEL/blob/codex/agent-provenance/examples/agent_provenance/README.md"
Issues = "https://github.com/Vovala14/CAEL/issues"

[project.optional-dependencies]
langgraph = ["langgraph>=1.2.20,<2"]
crewai = ["crewai>=1.15.39,<2"]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["cael_provenance"]

[tool.ruff]
line-length = 88
